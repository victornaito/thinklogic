<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco Sumiu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #070708; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; object-fit: contain; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../shared/base.js"></script>
<script>
// Reel: "E se o app do seu banco sumisse amanhã?" (caso Ueno Bank, Paraguai, nov/2026)
const DURATION = 21;
const SCENES = [[0, 3.8], [3.8, 8.2], [8.2, 13.2], [13.2, 17.6], [17.6, DURATION + 1]];

// opacidade da cena com entrada e saída suaves
const sceneAlpha = (t, [a, b], f = .35) => Math.min(easeOut(prog(t, a, a + f)), 1 - prog(t, b - f, b));

// linhas centralizadas; segmentos {s, c} onde c pode ser 'gold'
function centered(t, lines, top, size, lh, start, step = .15) {
  lines.forEach((ln, i) => {
    const p = easeOut(prog(t, start + i * step, start + .5 + i * step));
    if (p <= 0) return;
    ctx.save(); ctx.globalAlpha *= p; ctx.translate(0, (1 - p) * 30);
    ctx.font = F(900, size); ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    const total = ln.reduce((w, seg) => w + ctx.measureText(seg.s).width, 0);
    let x = (W - total) / 2; const y = top + i * lh;
    for (const seg of ln) {
      ctx.fillStyle = seg.c === 'gold' ? goldGrad(0, y - size, 0, y) : seg.c;
      ctx.fillText(seg.s, x, y); x += ctx.measureText(seg.s).width;
    }
    ctx.restore();
  });
}

function pill(text, cx, y, size = 34) {
  ctx.font = F(900, size); const w = ctx.measureText(text).width + 64;
  roundRect(cx - w / 2, y - size, w, size * 2, size); ctx.fillStyle = goldGrad(cx - w / 2, y - size, cx + w / 2, y + size); ctx.fill();
  ctx.fillStyle = '#0A0907'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, cx, y + 2);
}

// Cena 1: celular com o app do banco que some
function scene1(t) {
  centered(t, [[{s: 'E SE O APP DO', c: INK}], [{s: 'SEU BANCO SUMISSE', c: INK}], [{s: 'AMANHÃ?', c: 'gold'}]], 300, 82, 98, .1);
  const pp = easeOut(prog(t, .4, 1.0));
  const px = 330, py = 620 + (1 - pp) * 80, pw = 420, ph = 820;
  ctx.save(); ctx.globalAlpha *= pp;
  roundRect(px, py, pw, ph, 56); ctx.fillStyle = '#1B1915'; ctx.fill();
  ctx.strokeStyle = 'rgba(226,184,75,0.5)'; ctx.lineWidth = 4; ctx.stroke();
  roundRect(px + 16, py + 16, pw - 32, ph - 32, 42); ctx.fillStyle = '#0B0A09'; ctx.fill();
  roundRect(px + pw / 2 - 60, py + 30, 120, 26, 13); ctx.fillStyle = '#1B1915'; ctx.fill();
  // grade de apps
  const gx = px + 62, gy = py + 130, cell = 104;
  for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) {
    const x = gx + c * cell, y = gy + r * (cell + 30);
    if (r === 1 && c === 1) continue;
    roundRect(x, y, 84, 84, 22); ctx.fillStyle = 'rgba(244,239,228,0.10)'; ctx.fill();
  }
  // app do banco: glitch e desaparece
  const bx = gx + cell, by = gy + cell + 30;
  const g = prog(t, 1.7, 2.5);
  if (g < 1) {
    ctx.save(); ctx.globalAlpha *= 1 - g;
    const j = g > 0 ? Math.sin(t * 90) * 10 * g : 0;
    roundRect(bx + j, by, 84, 84, 22); ctx.fillStyle = goldGrad(bx, by, bx + 84, by + 84); ctx.fill();
    bankIcon(bx + 42 + j, by + 44, .48, '#0A0907');
    if (g > 0) { ctx.fillStyle = 'rgba(240,88,94,0.6)'; ctx.fillRect(bx - j, by + 30 + j * 2, 84, 10); }
    ctx.restore();
    ctx.fillStyle = INK; ctx.font = F(600, 18); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha *= 1 - g; ctx.fillText('Seu banco', bx + 42, by + 112); ctx.globalAlpha = pp * sceneAlpha(t, SCENES[0]);
  } else {
    ctx.setLineDash([10, 8]); ctx.strokeStyle = 'rgba(244,239,228,0.35)'; ctx.lineWidth = 3;
    roundRect(bx, by, 84, 84, 22); ctx.stroke(); ctx.setLineDash([]);
  }
  // aviso de conta indisponível
  const pt = backOut(prog(t, 2.5, 2.9));
  if (pt > 0) {
    ctx.save(); ctx.translate(px + pw / 2, py + ph - 150); ctx.scale(pt, pt);
    roundRect(-170, -48, 340, 96, 22); ctx.fillStyle = '#2A1314'; ctx.fill();
    ctx.strokeStyle = DOWN; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = DOWN; ctx.font = F(800, 28); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Conta indisponível', 0, -12);
    ctx.fillStyle = MUTED; ctx.font = F(500, 20); ctx.fillText('Saques bloqueados', 0, 22);
    ctx.restore();
  }
  ctx.restore();
}

// Cena 2: os números do caso
function scene2(t) {
  const a = SCENES[1][0];
  ctx.save(); ctx.globalAlpha *= easeOut(prog(t, a, a + .4)); pill('ACONTECEU NO PARAGUAI', W / 2, 330); ctx.restore();
  const stats = [
    {n: 3, fmt: v => `${Math.round(v)} MILHÕES`, txt: 'de clientes no Ueno Bank'},
    {n: 60, fmt: v => `~${Math.round(v)}%`, txt: 'da população adulta do país'},
    {n: 50, fmt: v => `< ${Math.round(v)}%`, txt: 'da solvência mínima exigida'},
  ];
  stats.forEach((s, i) => {
    const st = a + .4 + i * .7, p = easeOut(prog(t, st, st + .5));
    if (p <= 0) return;
    const y = 470 + i * 300;
    ctx.save(); ctx.globalAlpha *= p; ctx.translate((1 - p) * 60, 0);
    card(70, y, 940, 250, 32);
    const k = easeOut(prog(t, st + .1, st + 1.1));
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = goldGrad(0, y + 50, 0, y + 150); ctx.font = F(900, 96); ctx.fillText(s.fmt(s.n * k), 120, y + 140);
    ctx.fillStyle = INK; ctx.font = F(700, 36); ctx.fillText(s.txt, 120, y + 200);
    ctx.restore();
  });
  centered(t, [[{s: 'Contas bloqueadas.', c: INK}], [{s: 'Inclusive de ', c: INK}, {s: 'brasileiros.', c: 'gold'}]], 1500, 56, 72, a + 2.6);
}

// Cena 3: regras da primeira devolução
function scene3(t) {
  const a = SCENES[2][0];
  centered(t, [[{s: 'A 1ª DEVOLUÇÃO', c: INK}], [{s: 'SÓ VALEU PARA QUEM:', c: 'gold'}]], 360, 72, 88, a);
  const items = ['Tinha até ₲ 10 milhões', 'Não devia nada ao banco', 'Tinha conta ativa em OUTRO banco'];
  items.forEach((s, i) => {
    const st = a + .7 + i * .8, p = easeOut(prog(t, st, st + .5));
    if (p <= 0) return;
    const y = 560 + i * 230, hi = i === 2;
    ctx.save(); ctx.globalAlpha *= p; ctx.translate((1 - p) * 60, 0);
    card(70, y, 940, 180, 32);
    if (hi) {
      const pulse = .5 + .5 * Math.sin((t - st) * 4);
      roundRect(70, y, 940, 180, 32); ctx.strokeStyle = `rgba(255,214,110,${.6 + .4 * pulse})`; ctx.lineWidth = 4;
      ctx.shadowColor = 'rgba(255,214,110,0.7)'; ctx.shadowBlur = 24 * pulse; ctx.stroke(); ctx.shadowBlur = 0;
    }
    check(150, y + 90, backOut(prog(t, st + .2, st + .6)), hi ? GOLD : UP);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = F(800, hi ? 42 : 44);
    const lines = wrap(s, 760);
    lines.forEach((l, j) => {
      ctx.fillStyle = hi ? goldGrad(0, y + 40, 0, y + 140) : INK;
      ctx.fillText(l, 210, y + 90 + (j - (lines.length - 1) / 2) * 52);
    });
    ctx.restore();
  });
  centered(t, [[{s: 'Quem tinha tudo num banco só', c: INK}], [{s: 'ficou de fora.', c: DOWN}]], 1430, 52, 68, a + 3.4);
}

// Cena 4: um banco vs dois bancos
function scene4(t) {
  const a = SCENES[3][0];
  centered(t, [[{s: 'MESMA CRISE,', c: INK}], [{s: 'RESULTADOS OPOSTOS', c: 'gold'}]], 380, 72, 88, a);
  const cols = [
    {x: 70, title: '1 BANCO', n: 1, ok: false, txt: ['Dinheiro', 'bloqueado']},
    {x: 560, title: '2 BANCOS', n: 2, ok: true, txt: ['Dinheiro', 'disponível']},
  ];
  cols.forEach((c, i) => {
    const st = a + .6 + i * .6, p = easeOut(prog(t, st, st + .5));
    if (p <= 0) return;
    ctx.save(); ctx.globalAlpha *= p; ctx.translate(0, (1 - p) * 60);
    card(c.x, 560, 450, 720, 36);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = INK; ctx.font = F(900, 52); ctx.fillText(c.title, c.x + 225, 660);
    for (let k = 0; k < c.n; k++) {
      const bx = c.x + 225 + (c.n === 2 ? (k ? 80 : -80) : 0);
      const blocked = !c.ok || k === 0;
      bankIcon(bx, 840, c.n === 2 ? .9 : 1.2, blocked ? 'rgba(244,239,228,0.25)' : GOLD);
    }
    const sp = backOut(prog(t, st + .8, st + 1.2));
    if (sp > 0) (c.ok ? check : cross)(c.x + 225, 1000, sp * 1.6);
    ctx.fillStyle = c.ok ? UP : DOWN; ctx.font = F(900, 44); ctx.textAlign = 'center';
    c.txt.forEach((l, j) => ctx.fillText(l, c.x + 225, 1130 + j * 56));
    ctx.restore();
  });
}

// Cena 5: lição + CTA
function scene5(t) {
  const a = SCENES[4][0];
  centered(t, [[{s: 'TENHA PELO MENOS', c: INK}]], 640, 72, 88, a);
  const p = backOut(prog(t, a + .4, a + .9));
  if (p > 0) {
    ctx.save(); ctx.translate(W / 2, 830); ctx.scale(p, p);
    ctx.font = F(900, 158); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = 'rgba(255,214,110,0.5)'; ctx.shadowBlur = 30;
    ctx.fillStyle = goldGrad(0, -170, 0, 0); ctx.fillText('2 BANCOS', 0, 0); ctx.restore();
  }
  centered(t, [[{s: 'Diversificar também é escolher', c: INK}], [{s: 'onde o dinheiro fica.', c: INK}]], 1010, 46, 62, a + 1.0);
  const pc = easeOut(prog(t, a + 1.6, a + 2.1));
  if (pc > 0) { ctx.save(); ctx.globalAlpha *= pc; pill('Siga @victornaito.financas', W / 2, 1300, 38); ctx.restore(); }
  footnote(t, 'Fontes: Banco Central do Paraguai, La Nación, Forbes · nov/2026', a + 1.8, 1800);
}

const SCENE_FNS = [scene1, scene2, scene3, scene4, scene5];

function render(t) {
  ctx.clearRect(0, 0, W, H);
  ctx.globalAlpha = 1;
  background(t, 'R$');
  ctx.fillStyle = GOLD; ctx.font = F(700, 30); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('@victornaito.financas', 64, 140);
  SCENES.forEach((s, i) => {
    const al = sceneAlpha(t, s);
    if (al <= 0) return;
    ctx.save(); ctx.globalAlpha = al; SCENE_FNS[i](t); ctx.restore();
  });
}
startLoop(render, DURATION);
</script>
</body>
</html>
