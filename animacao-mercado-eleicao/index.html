<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mercado Pós-Eleição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #070708; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; object-fit: contain; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../shared/base.js"></script>
<script>
// Reação no 1º pregão após a vitória. Fontes: Reuters e InfoMoney (2026: parcial às 11h20).
const ROWS = [
  ['Ibovespa', 1.31, -16.4],
  ['Dólar', -2.54, 12],
  ['Petrobras', -8.47, -8.6],
  ['Banco do Brasil', -4.64, -31],
  ['Itaú', 2.91, -15.6],
];
const MAXABS = 31, DURATION = 12.5;
const CARD = {x: 48, y: 520, w: 984, h: 900};
const COLS = [650, 890], ROW0 = 760, RH = 124;

// mantém as casas decimais da fonte (−8,6% e não −8,60%)
const fmt = (shown, final) => {
  const d = (String(final).split('.')[1] || '').length;
  return (final > 0 ? '+' : '−') + ptBR(Math.abs(shown), d) + '%';
};

function table(t) {
  const pc = easeOut(prog(t, .7, 1.4));
  if (pc <= 0) return;
  ctx.save(); ctx.globalAlpha = pc; ctx.translate(0, (1 - pc) * 50);
  card(CARD.x, CARD.y, CARD.w, CARD.h);
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.fillStyle = MUTED; ctx.font = F(700, 26); ctx.letterSpacing = '3px';
  ctx.fillText('COMO O MERCADO REAGIU NO', CARD.x + 52, CARD.y + 74);
  ctx.fillText('1º PREGÃO APÓS A VITÓRIA', CARD.x + 52, CARD.y + 112);
  ctx.letterSpacing = '0px';

  ctx.font = F(800, 30); ctx.fillStyle = INK; ctx.fillText('Ativo', 96, ROW0 - 70);
  ctx.textAlign = 'center';
  ctx.fillText('31/10/2022', COLS[0], ROW0 - 70);
  ctx.fillStyle = GOLD; ctx.fillText('26/10/2026', COLS[1], ROW0 - 70);

  // destaque da coluna 2026
  const ph = easeOut(prog(t, 5.4, 6.0));
  if (ph > 0) {
    const pulse = .5 + .5 * Math.sin((t - 5.4) * 4);
    ctx.save(); ctx.globalAlpha = ph;
    roundRect(COLS[1] - 120, ROW0 - 120, 240, RH * ROWS.length + 70, 24);
    ctx.fillStyle = 'rgba(226,184,75,0.06)'; ctx.fill();
    ctx.strokeStyle = `rgba(226,184,75,${.45 + .35 * pulse})`; ctx.lineWidth = 3;
    ctx.shadowColor = 'rgba(255,214,110,0.6)'; ctx.shadowBlur = 18 * pulse; ctx.stroke();
    ctx.restore();
  }

  ROWS.forEach((r, i) => {
    const y = ROW0 + i * RH, a = 1.6 + i * .45;
    const pr = easeOut(prog(t, a, a + .5));
    if (pr <= 0) return;
    ctx.save(); ctx.globalAlpha = pr; ctx.translate((1 - pr) * 40, 0);
    if (i % 2 === 0) { roundRect(70, y - 52, 940, 104, 18); ctx.fillStyle = 'rgba(244,239,228,0.035)'; ctx.fill(); }
    ctx.textAlign = 'left'; ctx.fillStyle = INK; ctx.font = F(800, 40); ctx.fillText(r[0], 96, y + 14);
    [r[1], r[2]].forEach((v, c) => {
      const k = easeOut(prog(t, a + .15 + c * .2, a + 1.0 + c * .2));
      const col = v > 0 ? UP : DOWN;
      ctx.textAlign = 'center'; ctx.fillStyle = col; ctx.font = F(900, 44);
      ctx.fillText(fmt(v * k, v), COLS[c], y + 8);
      // barra proporcional
      const bw = (Math.abs(v) / MAXABS) * 180 * k;
      ctx.fillStyle = col; ctx.globalAlpha = pr * .55;
      roundRect(COLS[c] - bw / 2, y + 26, Math.max(bw, 1), 8, 4); ctx.fill();
      ctx.globalAlpha = pr;
    });
    ctx.restore();
  });
  ctx.restore();
}

function render(t) {
  ctx.clearRect(0, 0, W, H);
  background(t, '%');
  header(t, 'LULA ELEITO', '2022 × 2026', '@victornaito.financas');
  table(t);
  headline(t, [
    [{s: 'IBOVESPA NO 1º PREGÃO:', c: GOLD}],
    [{s: '2022 → ', c: INK}, {s: '+1,31%', c: UP}],
    [{s: '2026 → ', c: INK}, {s: '−16,4%', c: DOWN}],
  ], 1540, 6.3, 62, 82);
  footnote(t, '2022: fechamento. 2026: parcial às 11h20. Fontes: Reuters e InfoMoney.', 7.4);
}
startLoop(render, DURATION);
</script>
</body>
</html>
